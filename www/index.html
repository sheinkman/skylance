<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a22">
<title>Skylance</title>
<style>
  :root{--ink:#eef2ff;--muted:#a9b4d6;--glass:rgba(16,14,44,.62);--edge:rgba(255,255,255,.16);--gold:#ffd66b;--cyan:#7fe9ff;--rose:#ff7aa8;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  html,body{color-scheme:dark;margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;color:var(--ink);font-family:var(--font);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #game{position:absolute;display:block}
  #touch{position:fixed;inset:0}
  .btn{position:fixed;display:flex;align-items:center;justify-content:center;pointer-events:none;
    border-radius:50%;border:1.5px solid rgba(255,255,255,.28);
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.22),rgba(255,255,255,.05) 70%);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 6px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .06s,background .06s}
  .btn svg{width:46%;height:46%;fill:rgba(255,255,255,.85)}
  .btn.on{transform:scale(.92);background:radial-gradient(circle at 35% 30%,rgba(140,230,255,.55),rgba(80,140,255,.18) 70%)}
  #bl{left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:76px;height:76px}
  #br{left:calc(106px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:76px;height:76px}
  #bf{right:calc(22px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:112px;height:112px}
  #bf span{position:absolute;bottom:16%;font:700 11px var(--font);letter-spacing:2px;color:rgba(255,255,255,.75)}
  #bf svg{margin-bottom:12%}
  #bp{right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));width:40px;height:40px;border-radius:12px}
  .hide{display:none!important}
  #rotate{display:none;position:fixed;left:0;right:0;top:calc(18px + env(safe-area-inset-top));text-align:center;z-index:5;
    font:600 14px var(--font);color:#cfe6ff;opacity:.85;pointer-events:none}
  @media (orientation: portrait) and (pointer: coarse){#rotate{display:block}}

  /* ---------- menus ---------- */
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left, 0px));
    box-sizing:border-box;z-index:10}
  .screen[hidden]{display:none}
  .screen.dim{background:radial-gradient(ellipse at center,rgba(8,6,30,.55),rgba(4,3,16,.88))}
  .topbar{position:absolute;top:calc(10px + env(safe-area-inset-top));left:max(14px, env(safe-area-inset-left, 0px));right:max(14px, env(safe-area-inset-right, 0px));
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .topbar h2{margin:0;font-size:18px;font-weight:800;letter-spacing:.5px;text-wrap:balance}
  .gems{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);
    font-weight:800;font-variant-numeric:tabular-nums}
  .gem{width:10px;height:10px;display:inline-block;transform:rotate(45deg);border-radius:2px;
    background:linear-gradient(135deg,#e8ffff,#55c8ff 60%,#3a6bff);box-shadow:0 0 8px rgba(110,220,255,.8)}
  .logo{margin:0;font-size:clamp(46px,11vw,96px);font-weight:900;letter-spacing:2px;line-height:1;
    background:linear-gradient(180deg,#ffffff 20%,#8fe2ff 70%,#6a8cff);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(120,100,255,.65))}
  .tag{margin:0;color:var(--muted);font-size:14px;font-weight:600;text-align:center}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .ui-btn{appearance:none;border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:800 15px var(--font);letter-spacing:.6px;
    padding:12px 22px;border-radius:14px;min-width:120px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .08s,background .15s}
  .ui-btn:hover{background:rgba(40,36,90,.75)}
  .ui-btn:active{transform:scale(.96)}
  .ui-btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .ui-btn.primary{background:linear-gradient(180deg,#ffe58f,#ffb340);color:#3a2000;border-color:rgba(255,230,160,.8)}
  .ui-btn.small{min-width:0;padding:8px 14px;font-size:13px;border-radius:11px}
  .ui-btn[disabled]{opacity:.45;cursor:default}
  .hint{margin:0;color:rgba(200,210,240,.6);font-size:12px;text-align:center}

  /* map */
  .realm-head{display:flex;align-items:center;gap:14px}
  .realm-title{text-align:center;min-width:200px}
  .realm-title small{display:block;color:var(--muted);font-weight:700;letter-spacing:2px;font-size:11px}
  .realm-title b{font-size:22px}
  .levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;width:min(560px,100%)}
  .lvl{aspect-ratio:1;max-width:100%;border-radius:18px;border:1px solid var(--edge);background:var(--glass);color:var(--ink);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:800 20px var(--font);
    box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .08s}
  .lvl:active{transform:scale(.95)}
  .lvl:focus-visible{outline:2px solid var(--cyan)}
  .lvl .st{font-size:11px;letter-spacing:1px;color:#5a5f80}
  .lvl .st i{font-style:normal;color:var(--gold)}
  .lvl.boss{background:linear-gradient(160deg,rgba(120,40,90,.7),rgba(40,16,60,.8));border-color:rgba(255,120,170,.45);font-size:15px}
  .lvl.locked{opacity:.35;cursor:default}
  .lvl.done{border-color:rgba(255,214,107,.5)}
  .lock{width:14px;height:11px;border-radius:2px;background:#9aa3c8;position:relative;margin-top:6px}
  .lock::before{content:"";position:absolute;left:2px;top:-7px;width:6px;height:6px;border:2px solid #9aa3c8;border-bottom:0;border-radius:6px 6px 0 0}

  /* shop */
  .tabs{display:flex;gap:8px}
  .tab{appearance:none;border:1px solid var(--edge);background:transparent;color:var(--muted);font:800 13px var(--font);padding:8px 16px;border-radius:999px;cursor:pointer}
  .tab.on{background:rgba(127,233,255,.16);color:var(--ink);border-color:rgba(127,233,255,.5)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;width:min(760px,100%);max-height:62vh;overflow:auto;padding:4px;box-sizing:border-box}
  .card{background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:0}
  .card.eq{border-color:rgba(127,233,255,.7);box-shadow:0 0 0 1px rgba(127,233,255,.35),0 0 18px rgba(127,233,255,.18)}
  .card canvas{width:100%;aspect-ratio:3/2;border-radius:10px;background:radial-gradient(ellipse at center,#25205a,#0d0b26)}
  .card b{font-size:13px}
  .card p{margin:0;color:var(--muted);font-size:11px;min-height:2.4em}
  .card .ui-btn{min-width:0;padding:7px 8px;font-size:12px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px}

  .up-card{gap:7px}
  .up-head{display:flex;align-items:center;gap:8px}
  .up-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(127,233,255,.14);flex:none}
  .up-ic svg{width:18px;height:18px;fill:var(--cyan)}
  .pips{display:flex;gap:4px}
  .pips span{flex:1;height:5px;border-radius:3px;background:#3a3d5c}
  .pips span.on{background:var(--gold);box-shadow:0 0 6px rgba(255,200,80,.6)}
  .up-card p{min-height:3.6em}
  .up-card p em{font-style:normal;color:var(--gold)}
  /* result */
  .panel{background:var(--glass);border:1px solid var(--edge);border-radius:22px;padding:18px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;
    min-width:min(320px,100%);box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .panel h2{margin:0;font-size:28px;font-weight:900;text-wrap:balance;text-align:center}
  .stars{display:flex;gap:10px;font-size:40px;line-height:1}
  .stars[hidden]{display:none}
  .stars span{color:#3a3d5c;transition:color .3s,transform .3s}
  .stars span.on{color:var(--gold);text-shadow:0 0 16px rgba(255,200,80,.8);animation:pop .45s both}
  @keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
  .stats{display:grid;grid-template-columns:auto auto;gap:4px 22px;font-size:14px;font-variant-numeric:tabular-nums;margin:0}
  .stats dt{color:var(--muted);font-weight:600}
  .stats dd{margin:0;font-weight:800;text-align:right}
  .crit{font-size:12px;color:var(--muted);text-align:center;margin:0}
  @media (prefers-reduced-motion: reduce){.stars span.on{animation:none}}
  @media (max-height:420px){.logo{font-size:64px}.screen{gap:10px}.levels{width:min(470px,100%);gap:9px}.lvl{border-radius:14px;font-size:17px}.panel{padding:12px 20px;gap:7px}.stars{font-size:32px}.cards{max-height:58vh}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">Turn your phone sideways to play</div>
<div id="touch" class="hide">
  <div class="btn" id="bl"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 1.9-1.9L10.9 12l6.5-6.1z"/></svg></div>
  <div class="btn" id="br"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8-1.9-1.9 6.5-6.1-6.5-6.1z"/></svg></div>
  <div class="btn" id="bf"><svg viewBox="0 0 24 24"><path d="M12 13c-3-5-7-7-11-7 2 3 4 7 11 9 7-2 9-6 11-9-4 0-8 2-11 7z"/></svg><span>FLAP</span></div>
  <div class="btn" id="bp"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></div>
</div>

<section id="s-title" class="screen">
  <div class="topbar"><button class="ui-btn small" id="b-sound">Sound: On</button><span class="gems"><span class="gem"></span><span id="g-title">0</span></span></div>
  <h1 class="logo">SKYLANCE</h1>
  <p class="tag">Ride the skies. Strike from above. Claim every realm.</p>
  <div class="row">
    <button class="ui-btn primary" id="b-play">Play</button>
    <button class="ui-btn" id="b-endless">Endless</button>
    <button class="ui-btn" id="b-shop">Hangar</button>
  </div>
  <p class="hint" id="title-hint"></p>
</section>

<section id="s-map" class="screen dim" hidden>
  <div class="topbar"><button class="ui-btn small" id="b-map-back">Back</button><span class="gems"><span class="gem"></span><span id="g-map">0</span></span></div>
  <div class="realm-head">
    <button class="ui-btn small" id="b-realm-prev" aria-label="Previous realm">&#9664;</button>
    <div class="realm-title"><small id="realm-sub">REALM I</small><b id="realm-name">Moonlit Sea</b></div>
    <button class="ui-btn small" id="b-realm-next" aria-label="Next realm">&#9654;</button>
  </div>
  <div class="levels" id="levels"></div>
  <p class="hint" id="realm-hint"></p>
</section>

<section id="s-shop" class="screen dim" hidden>
  <div class="topbar"><button class="ui-btn small" id="b-shop-back">Back</button><h2>Hangar</h2><span class="gems"><span class="gem"></span><span id="g-shop">0</span></span></div>
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="mount">Mounts</button><button class="tab" data-tab="trail">Trails</button><button class="tab" data-tab="armor">Armor</button><button class="tab" data-tab="up">Upgrades</button>
  </div>
  <div class="cards" id="cards"></div>
</section>

<section id="s-result" class="screen dim" hidden>
  <div class="panel">
    <h2 id="r-title">Level Complete</h2>
    <div class="stars" id="r-stars"><span>&#9733;</span><span>&#9733;</span><span>&#9733;</span></div>
    <p class="crit" id="r-crit"></p>
    <dl class="stats" id="r-stats"></dl>
    <div class="row" id="r-btns"></div>
  </div>
</section>

<section id="s-pause" class="screen dim" hidden>
  <div class="panel">
    <h2>Paused</h2>
    <div class="row">
      <button class="ui-btn primary" id="b-resume">Resume</button>
      <button class="ui-btn" id="b-restart">Restart</button>
      <button class="ui-btn" id="b-quit">Quit</button>
    </div>
  </div>
</section>

<script>
'use strict';
// ====================================================================
//  SKYLANCE — an original flap-and-joust arcade game
// ====================================================================
const W = 640, H = 360, SEA = 332;
const G = 0.115, FLAP = 2.35, VY_MAX = 3.6, VY_MIN = -4;
const RW = 18, RH = 24, SPR = 1.45;
const TAU = Math.PI * 2;

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let K = 1;

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const wdx = (a, b) => ((b - a + W * 1.5) % W) - W / 2;
const $ = id => document.getElementById(id);
function seeded(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function mk(w, h, k = K) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * k)); c.height = Math.max(1, Math.ceil(h * k));
  const g = c.getContext('2d'); g.scale(k, k); return [c, g];
}
function glow(g, x, y, r, color, a = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalAlpha = a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.globalAlpha = 1;
}
const fmt = n => Math.floor(n).toLocaleString('en-US');

// ---------- catalog ----------
const MOUNTS = {
  dragonfly: { name: 'Dragonfly', price: 0, desc: 'Swift and balanced. Your first mount.', draw: drawDragonfly,
    pal: { body1: '#5ff1ff', body2: '#0f7fb5', eye: '#c9fbff', eye2: '#0a6c9a', wingA: 'rgba(190,245,255,.55)', wingB: 'rgba(200,170,255,.30)' } },
  moth: { name: 'Lunar Moth', price: 150, desc: 'Velvet wings with moon-eye markings.', draw: drawMoth,
    pal: { body1: '#f3e6ff', body2: '#8a6bb8', eye: '#ffffff', eye2: '#2a1a4a', wingA: 'rgba(214,196,255,.92)', wingB: 'rgba(130,222,200,.85)' } },
  humming: { name: 'Hummingbird', price: 300, desc: 'A blur of emerald and ruby.', draw: drawHumming,
    pal: { body1: '#6dffab', body2: '#0b7a55', throat: '#ff3d6e', wingA: 'rgba(210,255,235,.55)', wingB: 'rgba(120,220,200,.22)' } },
  beetle: { name: 'Gilded Beetle', price: 450, desc: 'A shell of polished gold.', draw: drawBeetle,
    pal: { body1: '#e8ff7a', body2: '#1f5a2a', shell: '#d4a017', wingA: 'rgba(255,240,200,.45)', wingB: 'rgba(255,200,120,.2)' } },
  phoenix: { name: 'Phoenix', price: 800, desc: 'Born of embers. Leaves the sky burning.', draw: drawPhoenix,
    pal: { body1: '#ffd36b', body2: '#e2401a', wingA: 'rgba(255,200,100,.88)', wingB: 'rgba(255,70,40,.6)' } },
};
const TRAILS = {
  azure: { name: 'Azure', price: 0, desc: 'Cool sparks of starlight.', c: () => 'rgba(120,235,255,.9)' },
  ember: { name: 'Ember', price: 100, desc: 'Drifting cinders that rise.', c: () => `hsl(${18 + Math.random() * 28},100%,60%)`, up: true },
  rainbow: { name: 'Prism', price: 200, desc: 'Every color, one after another.', c: () => `hsl(${(frame * 5) % 360},100%,70%)` },
  lightning: { name: 'Storm', price: 250, desc: 'Crackling white-violet sparks.', c: () => Math.random() < 0.5 ? '#f2ecff' : '#b49cff', jitter: true },
};
const ARMORS = {
  silver: { name: 'Silver Knight', price: 0, desc: 'Polished plate and azure cape.', pal: { armor1: '#ffffff', armor2: '#9fb3c8', cape1: '#3d7bff', cape2: '#1b2f8a', plume: '#ffcf3d', tip: '#8ff3ff' } },
  gold: { name: 'Sun Champion', price: 120, desc: 'Gold plate, crimson cape.', pal: { armor1: '#fff3b0', armor2: '#c8901a', cape1: '#e0402f', cape2: '#6a1010', plume: '#ffffff', tip: '#ffe28a' } },
  rose: { name: 'Rose Warden', price: 150, desc: 'Blush steel and petal-pink.', pal: { armor1: '#ffe6f0', armor2: '#d27aa0', cape1: '#ff6fa8', cape2: '#8a2050', plume: '#ffffff', tip: '#ffc0dc' } },
  obsidian: { name: 'Obsidian', price: 180, desc: 'Black glass armor, violet flame.', pal: { armor1: '#9a9ab4', armor2: '#1a1a28', cape1: '#7a2cff', cape2: '#2a0a5a', plume: '#c4a0ff', tip: '#c4a0ff' } },
};
const CATALOG = { mount: MOUNTS, trail: TRAILS, armor: ARMORS };
const UPGRADES = {
  wing: { name: 'Wing Power', cost: [40, 80, 140, 220, 320], fx: l => `+${l * 5}% flight speed and lift`, svg: '<path d="M12 13c-3-5-7-7-11-7 2 3 4 7 11 9 7-2 9-6 11-9-4 0-8 2-11 7z"/>' },
  lance: { name: 'Lance Reach', cost: [50, 100, 170, 260, 360], fx: l => l ? `Win clashes up to ${Math.round(l * 2.4)} px below a foe` : 'Win only when your lance is higher', svg: '<path d="M2 20.5 15.5 7l1.5 1.5L3.5 22z"/><path d="M14 3h7v7z"/>' },
  lives: { name: 'Extra Life', cost: [120, 260, 500], fx: l => `Start each level with ${3 + l} lives`, svg: '<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>' },
  power: { name: 'Power Surge', cost: [40, 90, 150, 230, 330], fx: l => `Power-ups last ${100 + l * 15}% and appear ${l * 10}% more`, svg: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>' },
  shield: { name: 'Guardian', cost: [60, 120, 200, 300, 420], fx: l => `${l * 20}% chance to start each life shielded`, svg: '<path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/>' },
  gems: { name: 'Gem Finder', cost: [80, 160, 260, 380, 520], fx: l => `+${l * 10}% gems from every run`, svg: '<path d="M6 3h12l4 6-10 13L2 9z"/>' },
  hatch: { name: 'Slow Hatch', cost: [40, 90, 150, 230], fx: l => `Cocoons hatch ${l * 15}% slower`, svg: '<path d="M12 2c4 0 7 6 7 11a7 7 0 0 1-14 0c0-5 3-11 7-11z"/>' },
  combo: { name: 'Combo Master', cost: [90, 200, 360], fx: l => `Combo multiplier goes up to x${5 + l}`, svg: '<path d="M4 20l8-7 8 7-2 2-6-5-6 5z"/><path d="M4 12l8-7 8 7-2 2-6-5-6 5z"/>' },
};

const PAL_E = [
  { body1: '#ffe066', body2: '#c48a00', armor1: '#7ee08a', armor2: '#2f7a45', cape1: '#3fa45a', cape2: '#16492a', plume: '#c6ff7a', tip: '#c6ff7a' },
  { body1: '#ff9a52', body2: '#b23a12', armor1: '#ff6b6b', armor2: '#8a1f2a', cape1: '#c2324a', cape2: '#5a0f1f', plume: '#ffb36b', tip: '#ffb36b' },
  { body1: '#cf9bff', body2: '#5b2bb5', armor1: '#8c8cff', armor2: '#2a2a7a', cape1: '#5a3ad6', cape2: '#1e1060', plume: '#f0d0ff', tip: '#e6b8ff' },
];
const ENEMY_PTS = [500, 750, 1500];
const ENEMY_GEMS = [1, 2, 3];

const PW = {
  shield: { name: 'SHIELD', col: '#7ff0ff', dur: 0 },
  lance: { name: 'LONG LANCE', col: '#ffd84a', dur: 600 },
  dash: { name: 'DASH', col: '#ff8a3d', dur: 480 },
  magnet: { name: 'MAGNET', col: '#ff6a9a', dur: 720 },
  frost: { name: 'FROST', col: '#bfefff', dur: 330 },
};
const PW_TYPES = Object.keys(PW);

    const st = save.stars[`${mapRealm}-${l}`] || 0, open = levelUnlocked(mapRealm, l);
    b.className = 'lvl' + (l === 10 ? ' boss' : '') + (open ? '' : ' locked') + (st ? ' done' : '');
    b.innerHTML = open ? `<span>${l === 10 ? 'BOSS' : l}</span><span class="st">${'<i>★</i>'.repeat(st)}${'☆'.repeat(3 - st)}</span>` : `<span class="lock"></span>`;
    b.setAttribute('aria-label', open ? `Level ${l}, ${st} of 3 stars` : `Level ${l}, locked`);
    if (open) b.onclick = () => startLevel(mapRealm, l); else b.disabled = true;
    box.appendChild(b);
  }
  $('realm-hint').textContent = realmUnlocked(mapRealm) ? R.hint
    : `Locked. Defeat the ${REALMS[mapRealm - 1].bossTitle} in ${REALMS[mapRealm - 1].name} first.`;
  show('s-map');
}

let shopTab = 'mount';
function previewCanvas(kind, id) {
  const k = Math.min(window.devicePixelRatio || 1, 2);
  const [c, g] = mk(150, 100, k);
  const pal = playerPal();
  let mount = save.eq.mount;
  if (kind === 'mount') { Object.assign(pal, MOUNTS[id].pal); mount = id; }
  if (kind === 'armor') Object.assign(pal, ARMORS[id].pal);
  const r = { isPlayer: true, face: 1, wingT: 8, onGround: false, anim: 1, state: 'active', pw: { lance: 0 } };
  if (kind === 'trail') {
    const tr = TRAILS[id];
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 26; i++) {
      const x = 58 - i * 2.4, y = 66 + Math.sin(i * 0.5) * 6 + (tr.jitter ? (Math.random() - 0.5) * 6 : 0) - (tr.up ? i * 0.5 : 0);
      const col = id === 'rainbow' ? `hsl(${i * 14},100%,70%)` : tr.c();
      glow(g, x, y, 5, col, 0.6 * (1 - i / 26)); g.fillStyle = col; g.globalAlpha = 1 - i / 26; g.beginPath(); g.arc(x, y, 1.5, 0, TAU); g.fill();
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }
  g.save(); g.translate(80, 50); g.scale(1.55, 1.55); g.translate(-80, -50);
  drawRiderAt(g, r, 80, 40, pal, mount); g.restore();
  return c;
}
function openShop(tab) {
  if (tab) shopTab = tab;
  game.state = 'menu';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === shopTab));
  const box = $('cards'); box.innerHTML = '';
  if (shopTab === 'up') { renderUpgrades(box); show('s-shop'); return; }
  const cat = CATALOG[shopTab];
  for (const id of Object.keys(cat)) {
    const it = cat[id], owned = save.owned[shopTab].includes(id), eq = save.eq[shopTab] === id;
    const card = document.createElement('div'); card.className = 'card' + (eq ? ' eq' : '');
    card.appendChild(previewCanvas(shopTab, id));
    const b = document.createElement('b'); b.textContent = it.name; card.appendChild(b);
    const p = document.createElement('p'); p.textContent = it.desc; card.appendChild(p);
    const btn = document.createElement('button'); btn.className = 'ui-btn' + (!owned && save.gems >= it.price ? ' primary' : '');
    if (eq) { btn.textContent = 'Equipped'; btn.disabled = true; }
    else if (owned) { btn.textContent = 'Equip'; btn.onclick = () => { save.eq[shopTab] = id; persist(); SFX.power(); openShop(); }; }
    else {
      btn.innerHTML = `<span class="gem"></span> ${fmt(it.price)}`;
      if (save.gems < it.price) { btn.disabled = true; btn.title = `Need ${fmt(it.price - save.gems)} more gems`; }
      else btn.onclick = () => { save.gems -= it.price; save.owned[shopTab].push(id); save.eq[shopTab] = id; persist(); SFX.up(); buzz('medium'); openShop(); };
    }
    card.appendChild(btn); box.appendChild(card);
  }
  show('s-shop');
}

function renderUpgrades(box) {
  for (const id of Object.keys(UPGRADES)) {
    const u = UPGRADES[id], lv = UP(id), max = u.cost.length;
    const card = document.createElement('div'); card.className = 'card up-card';
    card.innerHTML = `<div class="up-head"><span class="up-ic"><svg viewBox="0 0 24 24">${u.svg}</svg></span><b>${u.name}</b></div>
      <div class="pips">${Array.from({ length: max }, (_, i) => `<span class="${i < lv ? 'on' : ''}"></span>`).join('')}</div>
      <p>${lv ? u.fx(lv) : 'Not upgraded yet'}${lv < max ? `<br><em>Next: ${u.fx(lv + 1)}</em>` : ''}</p>`;
    const btn = document.createElement('button'); btn.className = 'ui-btn';
    if (lv >= max) { btn.textContent = 'Maxed'; btn.disabled = true; }
    else {
      const c = u.cost[lv];
      btn.innerHTML = `<span class="gem"></span> ${fmt(c)}`;
      if (save.gems < c) { btn.disabled = true; btn.title = `Need ${fmt(c - save.gems)} more gems`; }
      else { btn.classList.add('primary'); btn.onclick = () => { save.gems -= c; save.up[id] = lv + 1; persist(); SFX.up(); buzz('medium'); openShop(); }; }
    }
    card.appendChild(btn); box.appendChild(card);
  }
}
function resultButtons(list) {
  const btns = $('r-btns'); btns.innerHTML = '';
  for (const [txt, cls, fn] of list) { const b = document.createElement('button'); b.className = 'ui-btn ' + cls; b.textContent = txt; b.onclick = fn; btns.appendChild(b); }
}
function finishLevel(win) {
  game.state = 'result';
  const r = game.realm, l = game.level, key = `${r}-${l}`;
  const secs = waveT / 60, par = l === 10 ? 100 : 30 + enemyTotal * 7;
  const stars = win ? 1 + (deaths === 0 ? 1 : 0) + (secs <= par ? 1 : 0) : 0;
  const earned = Math.round((runGems + (win ? 5 : 0) + stars * 10) * (1 + 0.1 * UP('gems')));
  if (win) save.stars[key] = Math.max(save.stars[key] || 0, stars);
  save.gems += earned; save.best = Math.max(save.best, score); runGems = 0; persist();
  $('r-title').textContent = win ? (l === 10 ? 'Realm Conquered!' : 'Level Complete') : 'Out of Lives';
  const sEls = $('r-stars').children;
  for (let i = 0; i < 3; i++) sEls[i].className = '';
  $('r-stars').hidden = !win;
  if (win) for (let i = 0; i < stars; i++) setTimeout(() => { sEls[i].className = 'on'; SFX.star(i); }, 350 + i * 300);
  $('r-crit').textContent = win ? `★ Clear   ★ No deaths   ★ Under ${Math.round(par)}s` : 'Keep flapping, and hit them from above.';
  $('r-stats').innerHTML = `<dt>Score</dt><dd>${fmt(score)}</dd><dt>Time</dt><dd>${secs.toFixed(1)}s</dd><dt>Gems earned</dt><dd><span class="gem"></span> ${fmt(earned)}</dd>`;
  const list = [];
  if (win && l < 10) list.push(['Next', 'primary', () => startLevel(r, l + 1)]);
  else if (win && l === 10 && r + 1 < REALMS.length) list.push([REALMS[r + 1].name, 'primary', () => openMap(r + 1)]);
  list.push(['Retry', win ? '' : 'primary', () => startLevel(r, l)]);
  list.push(['Map', '', () => openMap(r)]);
  resultButtons(list);
  show('s-result');
}
function finishEndless() {
  game.state = 'result';
  const earned = Math.round((runGems + Math.floor(score / 2000)) * (1 + 0.1 * UP('gems')));
  const newBest = score > save.best;
  save.gems += earned; save.best = Math.max(save.best, score); runGems = 0; persist();
  $('r-title').textContent = newBest ? 'New Best!' : 'Game Over';
  $('r-stars').hidden = true;
  $('r-crit').textContent = `Reached wave ${wave}`;
  $('r-stats').innerHTML = `<dt>Score</dt><dd>${fmt(score)}</dd><dt>Best</dt><dd>${fmt(save.best)}</dd><dt>Gems earned</dt><dd><span class="gem"></span> ${fmt(earned)}</dd>`;
  resultButtons([['Play Again', 'primary', startEndless], ['Menu', '', goTitle]]);
  show('s-result');
}

$('b-play').onclick = () => { let r = 0; for (let i = REALMS.length - 1; i >= 0; i--) if (realmUnlocked(i)) { r = i; break; } openMap(r); };
$('b-endless').onclick = startEndless;
$('b-shop').onclick = () => openShop();
$('b-sound').onclick = toggleSound;
$('b-map-back').onclick = goTitle;
$('b-shop-back').onclick = goTitle;
$('b-realm-prev').onclick = () => openMap(Math.max(0, mapRealm - 1));
$('b-realm-next').onclick = () => openMap(Math.min(REALMS.length - 1, mapRealm + 1));
document.querySelectorAll('.tab').forEach(t => t.onclick = () => openShop(t.dataset.tab));
$('b-resume').onclick = resumeGame;
$('b-restart').onclick = () => game.mode === 'endless' ? startEndless() : startLevel(game.realm, game.level);
$('b-quit').onclick = () => game.mode === 'endless' ? goTitle() : openMap(game.realm);
$('b-sound').textContent = 'Sound: ' + (save.muted ? 'Off' : 'On');

// ---------- main loop ----------
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(t) {
  acc += Math.min(t - last, 100); last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}
setRealm(0);
resize();
goTitle();
requestAnimationFrame(loop);
window.__sky = { get game() { return game; }, get P() { return P; }, get enemies() { return enemies; }, get boss() { return boss; }, get score() { return score; },
  get pickups() { return pickups; }, get stals() { return stals; }, get bolts() { return bolts; }, get plats() { return PLATS; }, save, startLevel, startEndless, spawnPickup, openShop, openMap, input };
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a22">
<title>Skylance</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #game{position:absolute;display:block}
  #touch{position:fixed;inset:0}
  .btn{position:fixed;display:flex;align-items:center;justify-content:center;pointer-events:none;
    border-radius:50%;border:1.5px solid rgba(255,255,255,.28);
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.22),rgba(255,255,255,.05) 70%);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 6px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .06s,background .06s}
  .btn svg{width:46%;height:46%;fill:rgba(255,255,255,.85)}
  .btn.on{transform:scale(.92);background:radial-gradient(circle at 35% 30%,rgba(140,230,255,.55),rgba(80,140,255,.18) 70%)}
  #bl{left:calc(18px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:76px;height:76px}
  #br{left:calc(106px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:76px;height:76px}
  #bf{right:calc(22px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:112px;height:112px}
  #bf span{position:absolute;bottom:16%;font:700 11px system-ui,sans-serif;letter-spacing:2px;color:rgba(255,255,255,.75)}
  #bf svg{margin-bottom:12%}
  #bp{right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));width:40px;height:40px;border-radius:12px}
  .hide{display:none!important}
  #rotate{display:none;position:fixed;left:0;right:0;top:calc(18px + env(safe-area-inset-top));text-align:center;
    font:600 14px system-ui,sans-serif;color:#cfe6ff;opacity:.85;pointer-events:none}
  @media (orientation: portrait) and (pointer: coarse){#rotate{display:block}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate">Turn your phone sideways to play</div>
<div id="touch" class="hide">
  <div class="btn" id="bl"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8 1.9-1.9L10.9 12l6.5-6.1z"/></svg></div>
  <div class="btn" id="br"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8-1.9-1.9 6.5-6.1-6.5-6.1z"/></svg></div>
  <div class="btn" id="bf"><svg viewBox="0 0 24 24"><path d="M12 13c-3-5-7-7-11-7 2 3 4 7 11 9 7-2 9-6 11-9-4 0-8 2-11 7z"/></svg><span>FLAP</span></div>
  <div class="btn" id="bp"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></div>
</div>
<script>
'use strict';
// ====================================================================
//  SKYLANCE — an original flap-and-joust arcade game
// ====================================================================
const W = 640, H = 360, SEA = 332;
const G = 0.115, FLAP = 2.35, VY_MAX = 3.6, VY_MIN = -4;
const RW = 18, RH = 24;                       // rider box
const SPR = 1.45;                              // visual sprite scale
const TAU = Math.PI * 2;

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let K = 1;                                     // logical -> backing pixels

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const wdx = (a, b) => ((b - a + W * 1.5) % W) - W / 2;   // wrap-aware dx
function seeded(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function rrect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function mk(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * K)); c.height = Math.max(1, Math.ceil(h * K));
  const g = c.getContext('2d'); g.scale(K, K); return [c, g];
}
function glow(g, x, y, r, color, a = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalAlpha = a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.globalAlpha = 1;
}
const fmt = n => n.toLocaleString('en-US');

// ---------- world ----------
const PLATS = [
  { x: 0,   y: 300, w: 122, shore: 1 },
  { x: 518, y: 300, w: 122, shore: 1 },
  { x: 248, y: 256, w: 144, spawn: 1 },
  { x: 92,  y: 200, w: 104, spawn: 1 },
  { x: 424, y: 192, w: 112, spawn: 1 },
  { x: 0,   y: 122, w: 74 },
  { x: 572, y: 122, w: 68 },
  { x: 236, y: 112, w: 96, spawn: 1 },
  { x: 400, y: 66,  w: 84 },
  { x: 128, y: 58,  w: 66 },
].map((p, i) => ({ ...p, h: p.shore ? SEA - p.y + 30 : 12, id: i }));
const SPAWNS = PLATS.filter(p => p.spawn);
const SEA_L = 122, SEA_R = 518;                 // open water span

// ---------- palettes ----------
const PAL = {
  player: { body1: '#5ff1ff', body2: '#0f7fb5', eye: '#c9fbff', eye2: '#0a6c9a', armor1: '#ffffff', armor2: '#9fb3c8',
            cape1: '#3d7bff', cape2: '#1b2f8a', plume: '#ffcf3d', tip: '#8ff3ff', wingA: 'rgba(190,245,255,.55)', wingB: 'rgba(200,170,255,.30)' },
  e: [
    { body1: '#ffe066', body2: '#c48a00', armor1: '#7ee08a', armor2: '#2f7a45', cape1: '#3fa45a', cape2: '#16492a', plume: '#c6ff7a', tip: '#c6ff7a', name: 'Scout' },
    { body1: '#ff9a52', body2: '#b23a12', armor1: '#ff6b6b', armor2: '#8a1f2a', cape1: '#c2324a', cape2: '#5a0f1f', plume: '#ffb36b', tip: '#ffb36b', name: 'Raider' },
    { body1: '#cf9bff', body2: '#5b2bb5', armor1: '#8c8cff', armor2: '#2a2a7a', cape1: '#5a3ad6', cape2: '#1e1060', plume: '#f0d0ff', tip: '#e6b8ff', name: 'Elite' },
  ],
};
const ENEMY_PTS = [500, 750, 1500];

// ---------- art cache (rebuilt on resize) ----------
let ART = {};
let STARS = [];
const FLIES = [];
for (let i = 0; i < 28; i++) FLIES.push({ x: Math.random() * W, y: 40 + Math.random() * 270, p: Math.random() * TAU, s: 0.2 + Math.random() * 0.4 });
(function () { const r = seeded(7); for (let i = 0; i < 110; i++) STARS.push({ x: r() * W, y: r() * 230, s: r() * 1.3 + 0.3, p: r() * TAU }); })();

function buildArt() {
  // sky
  let [c, g] = mk(W, H);
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#060820'); sky.addColorStop(0.45, '#1b1546'); sky.addColorStop(0.75, '#4a2559'); sky.addColorStop(0.92, '#a8476a'); sky.addColorStop(1, '#f08a6a');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  // moon
  glow(g, 470, 70, 110, 'rgba(255,200,230,0.25)');
  glow(g, 470, 70, 48, 'rgba(255,240,220,0.6)');
  const mg = g.createRadialGradient(462, 62, 2, 470, 70, 24);
  mg.addColorStop(0, '#fffaf0'); mg.addColorStop(1, '#f2d7c0');
  g.fillStyle = mg; g.beginPath(); g.arc(470, 70, 24, 0, TAU); g.fill();
  g.fillStyle = 'rgba(200,160,150,.35)';
  [[462, 64, 5], [478, 78, 4], [474, 60, 2.5], [458, 80, 3]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); });
  // far mountains
  const r = seeded(3);
  [['#2a1d4f', 250, 60, 0.9], ['#1a1238', 280, 40, 1]].forEach(([col, base, amp]) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 16) g.lineTo(x, base - Math.abs(Math.sin(x * 0.013 + r() * 0.4)) * amp - r() * 12);
    g.lineTo(W, H); g.closePath(); g.fill();
  });
  // distant floating islands (hazy, parallax-free)
  const ri = seeded(21);
  [[60, 150, 46], [210, 175, 30], [345, 140, 38], [560, 165, 34], [620, 120, 22]].forEach(([x, y, w]) => {
    const dg = g.createLinearGradient(0, y, 0, y + w * 0.7);
    dg.addColorStop(0, 'rgba(70,50,120,.75)'); dg.addColorStop(1, 'rgba(30,20,60,0)');
    g.fillStyle = dg; g.beginPath(); g.moveTo(x - w / 2, y);
    for (let i = 0; i <= 6; i++) { const t = i / 6; g.lineTo(x - w / 2 + t * w, y + Math.sin(t * Math.PI) * w * (0.5 + ri() * 0.25)); }
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(120,200,140,.35)'; rrect(g, x - w / 2, y - 2, w, 3, 1.5); g.fill();
    glow(g, x + (ri() - 0.5) * w * 0.4, y + w * 0.25, 7, 'rgba(120,220,255,.35)');
  });
  const hz = g.createLinearGradient(0, 230, 0, SEA);
  hz.addColorStop(0, 'rgba(255,140,170,0)'); hz.addColorStop(1, 'rgba(255,150,170,.28)');
  g.fillStyle = hz; g.fillRect(0, 230, W, SEA - 230);
  ART.sky = c;

  // clouds
  ART.clouds = [];
  for (let i = 0; i < 3; i++) {
    const cw = 220, ch = 60; const [cc, cg] = mk(cw, ch); const rr = seeded(11 + i);
    for (let j = 0; j < 9; j++) {
      const x = 30 + rr() * 160, y = 25 + rr() * 15, rad = 14 + rr() * 22;
      const gr = cg.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, i === 2 ? 'rgba(255,170,190,.22)' : 'rgba(180,160,255,.16)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      cg.fillStyle = gr; cg.beginPath(); cg.arc(x, y, rad, 0, TAU); cg.fill();
    }
    ART.clouds.push(cc);
  }

  // islands
  ART.plats = PLATS.map(p => buildIsland(p));
}

function buildIsland(p) {
  const pad = 8, depth = p.shore ? 0 : 22 + (p.w / 6);
  const w = p.w, h = p.h;
  const [c, g] = mk(w + pad * 2, h + depth + pad * 2 + 20);
  g.translate(pad, pad);
  const r = seeded(100 + p.id * 13);
  if (p.shore) {
    const rk = g.createLinearGradient(0, 0, 0, h);
    rk.addColorStop(0, '#5a4478'); rk.addColorStop(1, '#1a1230');
    g.fillStyle = rk;
    g.beginPath(); g.moveTo(0, 4);
    const edge = p.x === 0 ? w : 0, other = p.x === 0 ? 0 : w;
    g.lineTo(other, 4); g.lineTo(other, h);
    g.lineTo(edge - (p.x === 0 ? 14 : -14), h); g.quadraticCurveTo(edge + (p.x === 0 ? 6 : -6), h * 0.5, edge, 4);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.06)'; g.lineWidth = 1;
    for (let i = 0; i < 5; i++) { g.beginPath(); const yy = 12 + i * 7; g.moveTo(0, yy); g.lineTo(w, yy + r() * 3); g.stroke(); }
  } else {
    // tapered rocky underside
    const rk = g.createLinearGradient(0, h * 0.4, 0, h + depth);
    rk.addColorStop(0, '#5b4580'); rk.addColorStop(0.6, '#2e2150'); rk.addColorStop(1, '#140d26');
    g.fillStyle = rk; g.beginPath(); g.moveTo(1, h * 0.5);
    const steps = Math.max(4, Math.floor(w / 14));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, x = t * w;
      const d = Math.sin(t * Math.PI) * depth * (0.7 + r() * 0.3) + h * 0.5;
      g.lineTo(x, d);
    }
    g.lineTo(w - 1, h * 0.5); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.07)';
    for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(w * 0.15, h + i * 5); g.lineTo(w * 0.85, h + i * 5 + r() * 2); g.stroke(); }
    // crystals
    const nc = 1 + Math.floor(r() * 3);
    for (let i = 0; i < nc; i++) {
      const cx = w * (0.25 + r() * 0.5), cy = h + depth * (0.25 + r() * 0.4), s = 3 + r() * 3;
      glow(g, cx, cy, s * 4, 'rgba(120,230,255,.45)');
      const cg = g.createLinearGradient(cx, cy - s * 1.6, cx, cy + s * 1.6);
      cg.addColorStop(0, '#e6fdff'); cg.addColorStop(1, '#3aa8ff');
      g.fillStyle = cg; g.beginPath(); g.moveTo(cx, cy - s * 1.7); g.lineTo(cx + s * 0.7, cy); g.lineTo(cx, cy + s * 1.7); g.lineTo(cx - s * 0.7, cy); g.closePath(); g.fill();
    }
    // vines
    g.strokeStyle = 'rgba(70,170,90,.8)'; g.lineWidth = 1.2;
    const nv = Math.floor(w / 26);
    for (let i = 0; i < nv; i++) {
      const vx = 6 + r() * (w - 12), len = 8 + r() * 16;
      g.beginPath(); g.moveTo(vx, h * 0.6); g.quadraticCurveTo(vx + 4, h * 0.6 + len * 0.5, vx - 1, h * 0.6 + len); g.stroke();
      g.fillStyle = '#7be08f'; g.beginPath(); g.arc(vx - 1, h * 0.6 + len, 1.4, 0, TAU); g.fill();
    }
  }
  // grassy top
  const gr = g.createLinearGradient(0, 0, 0, 9);
  gr.addColorStop(0, '#c4ff8a'); gr.addColorStop(0.4, '#6fd36a'); gr.addColorStop(1, '#2f8f55');
  g.fillStyle = gr; rrect(g, 0, 0, w, 9, p.shore ? 2 : 4.5); g.fill();
  g.fillStyle = 'rgba(255,255,220,.55)'; g.fillRect(3, 0.6, w - 6, 1);
  g.fillStyle = '#9ef57d';
  for (let x = 4; x < w - 4; x += 5 + r() * 6) {
    const hh = 2 + r() * 3; g.beginPath(); g.moveTo(x - 1.5, 1); g.lineTo(x, -hh); g.lineTo(x + 1.5, 1); g.fill();
  }
  // glowing mushrooms
  if (!p.shore || r() < 0.7) {
    const nm = 1 + Math.floor(r() * 2);
    for (let i = 0; i < nm; i++) {
      const mx = r() < 0.5 ? 5 + r() * 10 : w - 5 - r() * 10, ms = 1.6 + r() * 1.4;
      const col = r() < 0.5 ? 'rgba(120,240,255,' : 'rgba(255,140,230,';
      glow(g, mx, -ms, ms * 4, col + '.45)');
      g.fillStyle = '#e8f6ff'; g.fillRect(mx - 0.5, -ms, 1, ms + 1);
      g.fillStyle = col + '1)'; g.beginPath(); g.ellipse(mx, -ms, ms * 1.2, ms * 0.7, 0, Math.PI, TAU); g.fill();
    }
  }
  // tiny flowers
  for (let i = 0; i < w / 30; i++) {
    g.fillStyle = ['#ffd1f0', '#fff3a8', '#bfe8ff'][i % 3];
    g.beginPath(); g.arc(6 + r() * (w - 12), 1 + r() * 2, 1.1, 0, TAU); g.fill();
  }
  return { c, pad, w: w + pad * 2, h: h + depth + pad * 2 + 20 };
}

// ---------- canvas sizing ----------
function resize() {
  const vw = innerWidth, vh = innerHeight, s = Math.min(vw / W, vh / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  Object.assign(cv.style, { width: cw + 'px', height: ch + 'px', left: ((vw - cw) / 2) + 'px', top: ((vh - ch) / 2) + 'px' });
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  K = cv.width / W;
  buildArt();
}
addEventListener('resize', resize);

// ---------- audio ----------
let AC = null, muted = false;
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f1, f2, dur, type = 'square', vol = 0.06, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
}
const SFX = {
  flap: () => tone(260, 150, 0.07, 'triangle', 0.05),
  win: () => { tone(520, 1040, 0.12, 'square', 0.05); tone(780, 1560, 0.16, 'triangle', 0.05, 0.06); },
  die: () => { tone(600, 50, 0.6, 'sawtooth', 0.07); tone(300, 40, 0.6, 'square', 0.04, 0.05); },
  clank: () => tone(1200, 800, 0.05, 'square', 0.04),
  cocoon: () => { tone(880, 1320, 0.09, 'sine', 0.09); tone(1320, 1760, 0.1, 'sine', 0.07, 0.07); },
  hatch: () => tone(200, 420, 0.25, 'sawtooth', 0.04),
  wave: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.14, 'triangle', 0.06, i * 0.09)),
  splash: () => tone(400, 60, 0.35, 'sawtooth', 0.05),
  orb: () => tone(90, 180, 0.6, 'sawtooth', 0.05),
  up: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, 0.1, 'square', 0.05, i * 0.07)),
};

// ---------- input ----------
const input = { left: false, right: false, flapHeld: false, flapPressed: false, any: false };
const keys = {};
addEventListener('keydown', e => {
  audioInit();
  if (e.repeat) return;
  keys[e.code] = true; input.any = true;
  if (['Space', 'ArrowUp', 'KeyW', 'KeyZ', 'KeyX'].includes(e.code)) { input.flapPressed = true; e.preventDefault(); }
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { keys[e.code] = false; });
function readKeys() {
  const kl = keys.ArrowLeft || keys.KeyA, kr = keys.ArrowRight || keys.KeyD;
  const kf = keys.Space || keys.ArrowUp || keys.KeyW || keys.KeyZ || keys.KeyX;
  return { kl, kr, kf };
}
// touch
const touchEl = document.getElementById('touch');
const bl = document.getElementById('bl'), br = document.getElementById('br'), bf = document.getElementById('bf'), bp = document.getElementById('bp');
const pointers = new Map();
const touchState = { left: false, right: false, flap: false };
function zoneOf(x, y) {
  const pr = bp.getBoundingClientRect();
  if (x > pr.left - 12 && x < pr.right + 12 && y > pr.top - 12 && y < pr.bottom + 12) return 'pause';
  if (x < innerWidth * 0.42) {
    const a = bl.getBoundingClientRect(), b = br.getBoundingClientRect();
    const mid = (a.right + b.left) / 2;
    return x < mid ? 'left' : 'right';
  }
  return 'flap';
}
function refreshTouch() {
  touchState.left = touchState.right = touchState.flap = false;
  for (const z of pointers.values()) touchState[z] = true;
  bl.classList.toggle('on', touchState.left); br.classList.toggle('on', touchState.right); bf.classList.toggle('on', touchState.flap);
}
function onDown(e) {
  audioInit(); input.any = true;
  if (e.pointerType === 'touch') touchEl.classList.remove('hide');
  const z = zoneOf(e.clientX, e.clientY);
  if (z === 'pause') { if (game.state === 'play') togglePause(); return; }
  if (paused) { togglePause(); return; }
  pointers.set(e.pointerId, z);
  if (z === 'flap') input.flapPressed = true;
  refreshTouch(); e.preventDefault();
}
function onMove(e) {
  if (!pointers.has(e.pointerId)) return;
  const z = zoneOf(e.clientX, e.clientY);
  if (z === 'pause') return;
  if (z !== pointers.get(e.pointerId)) { if (z === 'flap') input.flapPressed = true; pointers.set(e.pointerId, z); refreshTouch(); }
}
function onUp(e) { pointers.delete(e.pointerId); refreshTouch(); }
addEventListener('pointerdown', onDown, { passive: false });
addEventListener('pointermove', onMove);
addEventListener('pointerup', onUp);
addEventListener('pointercancel', onUp);
addEventListener('contextmenu', e => e.preventDefault());
if (matchMedia('(pointer: coarse)').matches) touchEl.classList.remove('hide');

let paused = false;
function togglePause() { if (game.state !== 'play') return; paused = !paused; }
document.addEventListener('visibilitychange', () => { if (document.hidden && game.state === 'play') paused = true; });

// ---------- storage ----------
let best = 0;
try { best = +localStorage.getItem('skylance.best') || 0; } catch (e) { }
function saveBest() { try { localStorage.setItem('skylance.best', String(best)); } catch (e) { } }

// ---------- game state ----------
const game = { state: 'title', t: 0, overT: 0 };
let frame = 0, score = 0, lives = 0, nextLife = 20000, wave = 0, waveT = 0, diedThisWave = false, waveClearT = 0;
let P = null, enemies = [], cocoons = [], pending = [], parts = [], texts = [], fleers = [];
let banner = { text: '', sub: '', t: 0 }, shake = 0, flash = 0, chain = 0;
const serp = { ph: 0, t: 0, x: 0, cd: 0 };
let orb = null, orbDone = false;

function makeRider(isPlayer, tier, cx, bottom) {
  return { isPlayer, tier, x: cx - RW / 2, y: bottom - RH, w: RW, h: RH, vx: 0, vy: 0, face: Math.random() < 0.5 ? 1 : -1,
    onGround: true, wing: 0, wingT: 0, flapCd: 0, holdT: 0, state: 'spawn', st: isPlayer ? 150 : 55, invuln: 0, bump: 0,
    ai: { t: 0, ty: 120, dir: 1 }, anim: Math.random() * 10 };
}

function newGame() {
  score = 0; lives = 4; nextLife = 20000; wave = 0; enemies = []; cocoons = []; pending = []; parts = []; texts = []; fleers = [];
  spawnPlayer(); game.state = 'play'; paused = false; startWave(1);
}
function spawnPlayer() {
  const p = PLATS[2];
  P = makeRider(true, 0, p.x + p.w / 2, p.y); P.face = 1;
}
function startWave(n) {
  wave = n; waveT = 0; diedThisWave = false; chain = 0; waveClearT = 0;
  serp.ph = 0; serp.cd = 400; orb = null; orbDone = false;
  if (n % 5 === 0) {
    banner = { text: 'WAVE ' + n, sub: 'HATCHERY — grab the cocoons!', t: 150 };
    const count = Math.min(6 + n / 5, 12);
    for (let i = 0; i < count; i++) {
      const p = PLATS[i % PLATS.length];
      cocoons.push(makeCocoon(p.x + 15 + Math.random() * (p.w - 30), p.y - 40, 0, 0, n >= 10 ? 1 : 0, 200 + i * 25));
    }
  } else {
    const count = Math.min(3 + Math.floor(n * 0.8), 11);
    const p1 = clamp((n - 1) * 0.14, 0, 0.6), p2 = clamp((n - 4) * 0.07, 0, 0.45);
    for (let i = 0; i < count; i++) {
      const r = Math.random(); const tier = r < p2 ? 2 : r < p2 + p1 ? 1 : 0;
      pending.push({ tier, delay: 40 + i * 50 });
    }
    banner = { text: 'WAVE ' + n, sub: n === 1 ? 'Strike from above to win the joust' : (n % 5 === 4 ? 'Beware the serpent below' : ''), t: 130 };
  }
  SFX.wave();
}
function makeCocoon(x, y, vx, vy, tier, hatch) {
  return { x: x - 5, y, w: 10, h: 13, vx, vy, tier, onGround: false, hatch: hatch ?? Math.max(170, 380 - wave * 15), t: 0, rot: 0 };
}
function addScore(n, x, y, label) {
  score += n;
  if (x !== undefined) texts.push({ x, y, text: label || ('+' + n), t: 60, c: '#fff4b0' });
  if (score >= nextLife) { lives++; nextLife += 20000; texts.push({ x: P.x, y: P.y - 20, text: 'EXTRA LIFE', t: 90, c: '#7dffb2' }); SFX.up(); }
  if (score > best) { best = score; }
}

// ---------- particles ----------
function burst(x, y, n, color, spd = 2, life = 40, size = 2, glowy = true, grav = 0.05) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = Math.random() * spd;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.3, l: life * (0.5 + Math.random() * 0.5), L: life, c: color, s: size * (0.5 + Math.random()), glow: glowy, g: grav });
  }
}
function splash(x) {
  for (let i = 0; i < 26; i++) parts.push({ x: x + rnd(-6, 6), y: SEA, vx: rnd(-1.6, 1.6), vy: rnd(-4.5, -1.5), l: rnd(30, 50), L: 50, c: '#9fe6ff', s: rnd(1, 2.5), glow: false, g: 0.18 });
  SFX.splash();
}

// ---------- physics ----------
function moveBody(b) {
  b.onGround = false;
  b.x += b.vx;
  for (const p of PLATS) {
    if (b.y + b.h > p.y + 2 && b.y < p.y + p.h - 1 && b.x + b.w > p.x && b.x < p.x + p.w) {
      if (b.vx > 0) b.x = p.x - b.w; else if (b.vx < 0) b.x = p.x + p.w; b.vx = -b.vx * 0.5;
    }
  }
  b.x = (b.x + W) % W;
  const pb = b.y + b.h, pt = b.y;
  b.y += b.vy;
  for (const p of PLATS) {
    if (b.x + b.w > p.x + 1 && b.x < p.x + p.w - 1) {
      if (b.vy >= 0 && pb <= p.y + 0.01 && b.y + b.h >= p.y) { b.y = p.y - b.h; b.vy = 0; b.onGround = true; }
      else if (b.vy < 0 && pt >= p.y + p.h - 0.01 && b.y < p.y + p.h) { b.y = p.y + p.h; b.vy = Math.abs(b.vy) * 0.35; }
    }
  }
  if (b.y < 0) { b.y = 0; b.vy = 0.8; }
}
function control(r, dir, flap) {
  const airMax = r.isPlayer ? 3.4 : [2.0, 2.6, 3.2][r.tier];
  if (dir) r.face = dir;
  if (flap) {
    r.vy = Math.max(r.vy - FLAP, VY_MIN); r.wingT = 12; r.onGround = false;
    if (dir) r.vx += dir * 0.4;
    if (r.isPlayer) SFX.flap();
  }
  if (r.onGround) {
    if (dir) r.vx = clamp(r.vx + dir * 0.2, -2.4, 2.4); else r.vx *= 0.8;
  } else {
    // responsive air steering: players get strong control, enemies a bit less
    if (dir) r.vx += dir * (r.isPlayer ? 0.16 : 0.08);
    else r.vx *= r.isPlayer ? 0.975 : 0.995;
  }
  r.vx = clamp(r.vx, -airMax, airMax);
  r.vy = Math.min(r.vy + G, VY_MAX);
  moveBody(r);
  if (r.wingT > 0) r.wingT--;
  r.anim += r.onGround ? Math.abs(r.vx) * 0.25 : 0.2;
}

// ---------- update ----------
function update() {
  frame++;
  if (banner.t > 0) banner.t--;
  if (shake > 0) shake *= 0.86;
  if (flash > 0) flash--;
  updateParts();

  if (game.state === 'title') {
    if (input.any) { input.any = false; input.flapPressed = false; newGame(); }
    return;
  }
  if (game.state === 'over') {
    game.overT++;
    if (game.overT > 80 && input.any) { input.any = false; game.state = 'title'; }
    input.flapPressed = false;
    return;
  }
  if (paused) { input.flapPressed = false; return; }
  input.any = false;
  waveT++;

  // spawn queue
  for (const s of pending) s.delay--;
  for (let i = pending.length - 1; i >= 0; i--) {
    if (pending[i].delay <= 0) {
      const opts = SPAWNS.filter(p => !P || Math.abs(wdx(P.x, p.x + p.w / 2)) > 60 || Math.abs(P.y - p.y) > 50);
      const p = (opts.length ? opts : SPAWNS)[Math.floor(Math.random() * (opts.length || SPAWNS.length))];
      enemies.push(makeRider(false, pending[i].tier, p.x + p.w / 2 + rnd(-20, 20), p.y));
      pending.splice(i, 1);
    }
  }

  updatePlayer();
  for (const e of enemies) updateEnemy(e);
  collisions();
  updateCocoons();
  updateHazards();
  updateFleers();

  // wave clear
  if (enemies.length === 0 && cocoons.length === 0 && pending.length === 0) {
    if (waveClearT === 0) {
      waveClearT = 1;
      if (!diedThisWave) { addScore(3000); banner = { text: 'FLAWLESS', sub: '+3,000', t: 110 }; SFX.up(); }
      orb = null;
    }
    waveClearT++;
    if (waveClearT > 120) startWave(wave + 1);
  }
}

function updatePlayer() {
  const { kl, kr, kf } = readKeys();
  const left = kl || touchState.left, right = kr || touchState.right, held = kf || touchState.flap;
  const dir = left && !right ? -1 : right && !left ? 1 : 0;
  let flap = input.flapPressed; input.flapPressed = false;
  if (held) { P.holdT++; if (P.holdT % 16 === 0) flap = true; } else P.holdT = 0;
  if (flap) P.holdT = 0;

  if (P.state === 'dead') {
    P.st--;
    if (P.st <= 0) {
      if (lives > 0) spawnPlayer();
      else { game.state = 'over'; game.overT = 0; saveBest(); }
    }
    return;
  }
  if (P.state === 'spawn') {
    P.st--;
    if (dir || flap || P.st <= 0) { P.state = 'active'; P.invuln = 90; } else return;
  }
  if (P.invuln > 0) P.invuln--;
  if (P.bump > 0) P.bump--;
  control(P, dir, flap);
  if (!P.onGround && frame % 2 === 0) parts.push({ x: P.x + 9 - P.face * 10 + rnd(-2, 2), y: P.y + 17 + rnd(-2, 2), vx: -P.vx * 0.2, vy: rnd(-0.2, 0.2), l: 22, L: 22, c: 'rgba(120,235,255,.9)', s: 1.1, glow: true, g: 0 });
  if (P.y + P.h >= SEA + 2) { splash(P.x + P.w / 2); killPlayer(false); }
}
function killPlayer(fx = true) {
  if (P.state !== 'active') return;
  if (fx) { burst(P.x + 9, P.y + 12, 40, '#8ff3ff', 3, 50, 2.2); burst(P.x + 9, P.y + 12, 16, '#ffffff', 2, 30, 1.5); }
  P.state = 'dead'; P.st = 110; lives--; diedThisWave = true; shake = 8; flash = 6; SFX.die();
  if (lives <= 0) P.st = 90;
}

function updateEnemy(e) {
  if (e.state === 'spawn') { e.st--; if (e.st <= 0) e.state = 'active'; return; }
  if (e.state === 'hatch') {
    e.st--;
    if (e.st === 30) fleers.push({ x: e.x + 9 + (e.face > 0 ? -140 : 140), y: e.y - 60, tx: e.x, ty: e.y, tier: e.tier, face: e.face, arrive: true, t: 30 });
    if (e.st <= 0) { e.state = 'active'; e.vy = -2; burst(e.x + 9, e.y + 14, 14, PAL.e[e.tier].plume, 1.5, 30, 1.5); }
    return;
  }
  if (e.bump > 0) e.bump--;
  const a = e.ai;
  if (--a.t <= 0) {
    a.t = rnd(40, 90);
    const alive = P && P.state === 'active';
    if (e.tier === 0 || !alive) a.ty = rnd(40, 270);
    else if (e.tier === 1) a.ty = P.y - 4 + rnd(-30, 30);
    else a.ty = P.y - 30 + rnd(-10, 10);
    a.ty = clamp(a.ty, 24, 272);
    const chase = [0.45, 0.72, 0.92][e.tier];
    a.dir = alive && Math.random() < chase ? Math.sign(wdx(e.x, P.x)) || 1 : (Math.random() < 0.5 ? -1 : 1);
  }
  let flap = false;
  if (e.flapCd > 0) e.flapCd--;
  if (e.flapCd <= 0 && (e.y > a.ty + 4 || (e.y > 270 && e.vy > 0))) { flap = true; e.flapCd = [17, 13, 9][e.tier] + Math.floor(rnd(0, 7)); }
  control(e, a.dir, flap);
  if (!e.onGround && frame % 4 === 0) parts.push({ x: e.x + 9 - e.face * 12, y: e.y + 18, vx: 0, vy: 0, l: 16, L: 16, c: PAL.e[e.tier].plume, s: 0.9, glow: true, g: 0 });
  if (e.y + e.h >= SEA + 2) { splash(e.x + 9); e.dead = true; }
}
function defeat(e, how) {
  const pal = PAL.e[e.tier];
  e.dead = true;
  burst(e.x + 9, e.y + 10, 30, pal.plume, 3, 45, 2);
  burst(e.x + 9, e.y + 10, 10, '#ffffff', 2.5, 25, 1.4);
  shake = 5; flash = 3;
  if (how === 'joust') {
    addScore(ENEMY_PTS[e.tier], e.x + 9, e.y - 6);
    cocoons.push(makeCocoon(e.x + 9, e.y + 8, e.vx * 0.6, -1.2, e.tier));
    fleers.push({ x: e.x + 9, y: e.y, vx: e.face * 2.6, vy: -1.4, tier: e.tier, face: e.face, t: 0 });
  } else {
    addScore(500, e.x + 9, e.y - 6);
  }
  SFX.win();
}

function collisions() {
  if (P.state === 'active') {
    for (const e of enemies) {
      if (e.dead || e.state === 'spawn') continue;
      const dx = wdx(P.x, e.x), dy = e.y - P.y;
      if (Math.abs(dx) < 21 && Math.abs(dy) < 26) {
        if (e.state === 'hatch') { defeat(e, 'foot'); continue; }
        if (P.bump > 0 || e.bump > 0) continue;
        if (dy > 5) defeat(e, 'joust');
        else if (dy < -5 && P.invuln <= 0) { e.vy = -1.5; killPlayer(); }
        else {
          const s = Math.sign(dx) || 1;
          P.vx = -s * 2.2; e.vx = s * 2.2; P.vy = Math.min(P.vy, -0.6); e.vy = Math.min(e.vy, -0.6);
          P.bump = e.bump = 12; e.ai.dir = s;
          burst(P.x + 9 + dx / 2, P.y + 8, 10, '#fff7c2', 2.5, 18, 1.3); SFX.clank(); shake = 2.5;
        }
      }
    }
  }
  // enemy vs enemy
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j];
    if (a.state !== 'active' || b.state !== 'active' || a.bump || b.bump) continue;
    const dx = wdx(a.x, b.x);
    if (Math.abs(dx) < 20 && Math.abs(a.y - b.y) < 24) {
      const s = Math.sign(dx) || 1; a.vx = -s * 1.6; b.vx = s * 1.6; a.bump = b.bump = 14; a.ai.dir = -s; b.ai.dir = s;
    }
  }
  enemies = enemies.filter(e => !e.dead);
}

function updateCocoons() {
  for (const c of cocoons) {
    c.t++;
    c.vy = Math.min(c.vy + G * 0.8, VY_MAX);
    c.vx *= c.onGround ? 0.88 : 0.99;
    const wasAir = !c.onGround;
    moveBody(c);
    if (c.onGround && wasAir && c.vy === 0) burst(c.x + 5, c.y + 12, 4, '#e8f0ff', 0.8, 15, 1, false, 0);
    if (c.onGround) { c.hatch--; c.rot = c.hatch < 90 ? Math.sin(frame * 0.6) * (1 - c.hatch / 90) * 0.5 : 0; }
    if (c.y + c.h >= SEA + 2) { splash(c.x + 5); c.dead = true; continue; }
    if (P.state === 'active') {
      const dx = wdx(P.x + 9, c.x + 5), dy = (c.y + 6) - (P.y + 12);
      if (Math.abs(dx) < 17 && Math.abs(dy) < 22) {
        c.dead = true; chain++;
        const pts = Math.min(250 * chain, 1000) + (c.onGround ? 0 : 500);
        addScore(pts, c.x + 5, c.y - 6, c.onGround ? '+' + pts : 'AIR CATCH +' + pts);
        burst(c.x + 5, c.y + 6, 20, '#fff6c8', 2, 30, 1.6); SFX.cocoon();
        continue;
      }
    }
    if (c.hatch <= 0) {
      c.dead = true;
      const e = makeRider(false, Math.min(c.tier + 1, 2), c.x + 5, c.y + c.h);
      e.state = 'hatch'; e.st = 80; e.face = Math.sign(wdx(c.x, P.x)) || 1;
      enemies.push(e);
      burst(c.x + 5, c.y + 6, 18, '#efe6ff', 1.6, 30, 1.6); SFX.hatch();
    }
  }
  cocoons = cocoons.filter(c => !c.dead);
}

function updateHazards() {
  // serpent
  if (waveT > 900 || wave >= 4) {
    if (serp.ph === 0) {
      serp.cd--;
      if (serp.cd <= 0) {
        const cx = P.x + 9;
        if (P.state === 'active' && P.y + P.h > SEA - 60 && cx > SEA_L + 6 && cx < SEA_R - 6) { serp.ph = 1; serp.t = 40; serp.x = cx; }
        else serp.cd = 30;
      }
    } else if (serp.ph === 1) {
      if (frame % 4 === 0) parts.push({ x: serp.x + rnd(-10, 10), y: SEA, vx: 0, vy: -rnd(0.5, 1.5), l: 20, L: 20, c: '#bff0ff', s: 1.5, glow: false, g: 0.06 });
      if (--serp.t <= 0) { serp.ph = 2; serp.t = 56; splash(serp.x); }
    } else if (serp.ph === 2) {
      serp.t--;
      const k = Math.sin(Math.PI * (1 - serp.t / 56));
      serp.headY = SEA - 8 - 64 * k;
      if (P.state === 'active') serp.x += clamp(wdx(serp.x, P.x + 9), -0.8, 0.8);
      serp.x = clamp(serp.x, SEA_L + 8, SEA_R - 8);
      if (P.state === 'active' && P.invuln <= 0 && k > 0.3) {
        const dx = Math.abs(wdx(P.x + 9, serp.x));
        if (dx < 12 && P.y + P.h > serp.headY - 4) { killPlayer(); texts.push({ x: serp.x, y: serp.headY - 18, text: 'SNATCHED!', t: 70, c: '#ff9f9f' }); }
      }
      for (const e of enemies) if (e.state === 'active' && Math.abs(wdx(e.x + 9, serp.x)) < 12 && e.y + e.h > serp.headY && k > 0.3) { e.dead = true; burst(e.x + 9, e.y + 10, 20, PAL.e[e.tier].plume, 2, 30); }
      if (serp.t <= 0) { serp.ph = 0; serp.cd = rnd(220, 460); splash(serp.x); }
    }
  }
  // storm orb
  if (!orbDone && waveT > 2700 && enemies.length + pending.length > 0) {
    orbDone = true; orb = { x: Math.random() * W, y: 10, vx: 0, vy: 0, t: 0 };
    banner = { text: 'STORM ORB', sub: 'Hit it from above when its shield drops', t: 120 }; SFX.orb();
  }
  if (orb) {
    orb.t++;
    const spd = 1.1 + Math.min(wave * 0.05, 0.9);
    if (P.state === 'active') { orb.vx += Math.sign(wdx(orb.x, P.x + 9)) * 0.05; orb.vy += Math.sign(P.y + 12 - orb.y) * 0.05; }
    const m = Math.hypot(orb.vx, orb.vy); if (m > spd) { orb.vx *= spd / m; orb.vy *= spd / m; }
    orb.x = (orb.x + orb.vx + W) % W; orb.y = clamp(orb.y + orb.vy, 12, SEA - 30);
    orb.shield = (orb.t % 220) < 150;
    if (P.state === 'active') {
      const dx = wdx(P.x + 9, orb.x), dy = orb.y - (P.y + 12);
      if (Math.hypot(dx, dy) < 16) {
        if (!orb.shield && dy > 2) {
          addScore(2500, orb.x, orb.y - 14); burst(orb.x, orb.y, 60, '#c9a8ff', 4, 60, 2.5); burst(orb.x, orb.y, 30, '#ffffff', 3, 40, 1.5);
          orb = null; shake = 10; flash = 8; SFX.up();
        } else if (P.invuln <= 0) killPlayer();
        else { P.vx = -Math.sign(dx) * 3; }
      }
    }
  }
}

function updateFleers() {
  for (const f of fleers) {
    if (f.arrive) { f.x += (f.tx + 9 - f.x) * 0.12; f.y += (f.ty - f.y) * 0.12; if (--f.t <= 0) f.dead = true; }
    else { f.t++; f.x += f.vx; f.y += f.vy; f.vy -= 0.03; if (f.y < -40) f.dead = true; }
  }
  fleers = fleers.filter(f => !f.dead);
}
function updateParts() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.98; p.l--; }
  parts = parts.filter(p => p.l > 0);
  for (const t of texts) { t.t--; t.y -= 0.4; }
  texts = texts.filter(t => t.t > 0);
}

// ====================================================================
//  RENDERING
// ====================================================================
function drawWing(g, rx, ry, len, wid, ang, colA, colB) {
  g.save(); g.translate(rx, ry); g.rotate(ang);
  const gr = g.createLinearGradient(0, 0, len, 0);
  gr.addColorStop(0, colA); gr.addColorStop(1, colB);
  g.fillStyle = gr; g.beginPath(); g.ellipse(len / 2, 0, len / 2, wid / 2, 0, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 0.5; g.stroke();
  g.beginPath(); g.moveTo(1, 0); g.lineTo(len - 1, 0); g.strokeStyle = 'rgba(255,255,255,.3)'; g.stroke();
  g.restore();
}
function wingAngle(r, buzz) {
  if (r.wingT > 0) { const k = r.wingT / 12; return Math.PI + 1.05 * Math.sin(k * Math.PI) - 0.45 + (1 - k) * 0.2; }
  if (r.onGround) return Math.PI + 0.12;
  return Math.PI + 0.2 + Math.sin(frame * (buzz ? 1.4 : 0.35) + r.anim) * (buzz ? 0.35 : 0.12);
}

function drawKnight(g, pal, isPlayer, standing, t) {
  const oy = standing ? 9 : 0;
  // cape
  const cg = g.createLinearGradient(-10, 4 + oy, 0, 14 + oy);
  cg.addColorStop(0, pal.cape1); cg.addColorStop(1, pal.cape2);
  g.fillStyle = cg; g.beginPath(); g.moveTo(-1, 4.5 + oy);
  g.quadraticCurveTo(-7, 6 + oy + Math.sin(t) * 1.2, -11, 10 + oy + Math.sin(t * 1.3) * 2);
  g.quadraticCurveTo(-6, 11 + oy, -1, 12 + oy); g.closePath(); g.fill();
  // legs
  g.strokeStyle = pal.armor2; g.lineWidth = 2; g.lineCap = 'round';
  g.beginPath();
  if (standing) { g.moveTo(-1, 12 + oy); g.lineTo(-2, 16 + oy); g.moveTo(1, 12 + oy); g.lineTo(2, 16 + oy); }
  else { g.moveTo(0, 11); g.lineTo(2.5, 14.5); }
  g.stroke();
  // torso
  const ag = g.createLinearGradient(-3, 4 + oy, 3, 12 + oy);
  ag.addColorStop(0, pal.armor1); ag.addColorStop(1, pal.armor2);
  g.fillStyle = ag; rrect(g, -3, 4.5 + oy, 6, 7.5, 2); g.fill();
  // lance
  const lg = g.createLinearGradient(-5, 0, 18, 0); lg.addColorStop(0, '#6b4a2b'); lg.addColorStop(1, '#d9b98a');
  g.strokeStyle = lg; g.lineWidth = 1.7; g.beginPath(); g.moveTo(-5, 10 + oy); g.lineTo(16, 7.5 + oy); g.stroke();
  glow(g, 19, 7.2 + oy, 6, pal.tip, 0.8);
  g.fillStyle = '#f5fbff'; g.beginPath(); g.moveTo(15.5, 6 + oy); g.lineTo(21.5, 7.2 + oy); g.lineTo(15.5, 9 + oy); g.closePath(); g.fill();
  // arm + shield
  g.fillStyle = pal.armor1; g.beginPath(); g.arc(1.5, 8.5 + oy, 1.6, 0, TAU); g.fill();

function drawDragonfly(g, pal, r) {

  drawWing(g, 2, 15, 18, 5, a + 0.18, 'rgba(160,220,255,.35)', 'rgba(190,150,255,.2)');

function drawWasp(g, pal, r) {

function drawRiderAt(r, cx, y) {
  const isP = r.isPlayer, pal = isP ? PAL.player : PAL.e[r.tier];
  ctx.save(); ctx.translate(cx, y + RH); ctx.scale(r.face * SPR, SPR); ctx.translate(0, -RH);

    drawKnight(ctx, pal, false, true, frame * 0.2);

    if (isP) drawDragonfly(ctx, pal, r); else drawWasp(ctx, pal, r);

function drawRider(r) {

function drawOrb() {
  if (!orb) return;
  drawWrapped(orb.x - 20, 40, xx => {

    ctx.globalCompositeOperation = 'lighter';

    const g = ctx.createRadialGradient(x, y, 1, x, y, 11);

    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.fill();

function drawSea(front) {
  if (!front) {
    const g = ctx.createLinearGradient(0, SEA - 4, 0, H);
    g.addColorStop(0, '#2c4f8a'); g.addColorStop(0.3, '#16295a'); g.addColorStop(1, '#070c26');
    ctx.fillStyle = g; ctx.fillRect(0, SEA - 4, W, H - SEA + 4);
    // moon reflection
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 9; i++) {
      const yy = SEA + 2 + i * 3.2, ww = 26 - i * 1.5 + Math.sin(frame * 0.08 + i) * 6;
      ctx.fillStyle = `rgba(255,220,200,${0.22 - i * 0.02})`;
      ctx.fillRect(470 - ww / 2 + Math.sin(frame * 0.05 + i * 1.7) * 3, yy, ww, 1.2);
    }

  }

  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, SEA + Math.sin(x * 0.04 + frame * 0.05) * 1.6 + Math.sin(x * 0.11 - frame * 0.07) * 0.8);
  ctx.lineTo(W, H); ctx.closePath();
  const g = ctx.createLinearGradient(0, SEA - 2, 0, H);
  g.addColorStop(0, 'rgba(70,140,210,.55)'); g.addColorStop(0.5, 'rgba(20,40,100,.65)'); g.addColorStop(1, 'rgba(5,10,35,.9)');
  ctx.fillStyle = g; ctx.fill();
  ctx.beginPath();
  for (let x = 0; x <= W; x += 8) { const yy = SEA + Math.sin(x * 0.04 + frame * 0.05) * 1.6 + Math.sin(x * 0.11 - frame * 0.07) * 0.8; x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); }
  ctx.strokeStyle = 'rgba(190,235,255,.6)'; ctx.lineWidth = 1; ctx.stroke();
  const mist = ctx.createLinearGradient(0, SEA - 18, 0, SEA + 6);
  mist.addColorStop(0, 'rgba(200,180,255,0)'); mist.addColorStop(1, `rgba(200,190,255,${0.12 + 0.04 * Math.sin(frame * 0.02)})`);

function drawBackground() {
  ctx.drawImage(ART.sky, 0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (const s of STARS) {
    const a = 0.35 + 0.45 * Math.sin(frame * 0.03 + s.p);
    ctx.fillStyle = `rgba(255,255,255,${a * (1 - s.y / 260)})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  // aurora ribbons
  const bands = [[38, 'rgba(90,255,190,', 0.012, 0], [62, 'rgba(190,110,255,', 0.009, 2]];
  for (const [by, col, fr, ph] of bands) {
    for (let x = 0; x < W; x += 6) {
      const top = by + Math.sin(x * fr + frame * 0.006 + ph) * 16 + Math.sin(x * fr * 2.7 - frame * 0.01) * 6;
      const hgt = 34 + Math.sin(x * 0.02 + frame * 0.012 + ph) * 12;
      const a = 0.07 + 0.05 * Math.sin(x * 0.03 + frame * 0.02 + ph);
      const ag = ctx.createLinearGradient(0, top, 0, top + hgt);
      ag.addColorStop(0, col + '0)'); ag.addColorStop(0.35, col + a + ')'); ag.addColorStop(1, col + '0)');
      ctx.fillStyle = ag; ctx.fillRect(x, top, 6.5, hgt);
    }
  }
  // moonbeams
  ctx.save(); ctx.translate(470, 70);
  for (let i = 0; i < 5; i++) {
    const a = 1.75 + i * 0.32 + Math.sin(frame * 0.004 + i) * 0.06;
    ctx.rotate(0); ctx.fillStyle = `rgba(255,225,240,${0.035 + 0.02 * Math.sin(frame * 0.01 + i * 2)})`;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a - 0.05) * 420, Math.sin(a - 0.05) * 420); ctx.lineTo(Math.cos(a + 0.05) * 420, Math.sin(a + 0.05) * 420); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
  const cs = [[0, 30, 0.08], [1, 150, 0.14], [2, 210, 0.22]];
  for (const [i, y, sp] of cs) {
    const x = ((frame * sp + i * 260) % (W + 220)) - 220;
    ctx.drawImage(ART.clouds[i], x, y, 220, 60);
    ctx.drawImage(ART.clouds[i], x - W - 220 + 220, y, 220, 60);
  }
}
function drawPlatforms() {

function drawParts() {

function bigText(text, y, size, c1, c2) {

function drawBanner() {

  ctx.globalAlpha = 1;
}

const demo = { isPlayer: true, tier: 0, x: 0, y: 0, face: 1, wingT: 0, onGround: false, anim: 0, state: 'active' };
function drawTitle() {
  ctx.fillStyle = 'rgba(5,5,20,.35)'; ctx.fillRect(0, 0, W, H);
  // demo rider looping
  const t = frame * 0.012;
  const dx = W / 2 + Math.sin(t) * 220, dy = 120 + Math.sin(t * 2.3) * 30;
  demo.face = Math.cos(t) >= 0 ? 1 : -1; demo.x = dx - 9; demo.y = dy;
  demo.wingT = (frame % 22 < 12) ? 12 - (frame % 22) : 0; demo.anim = frame * 0.1;
  ctx.save(); ctx.translate(dx, dy - 40); ctx.scale(1.6, 1.6); ctx.translate(-dx, -dy);
  drawRiderAt(demo, dx, dy); ctx.restore();

  bigText('SKYLANCE', 88, 58, '#ffffff', '#7fd8ff');
  ctx.font = `600 11px ${FONT}`; ctx.fillStyle = 'rgba(220,225,255,.85)'; ctx.textAlign = 'center';
  ctx.fillText('Ride the dragonfly. Strike from above. Claim the night sky.', W / 2, 110);
  const p = 0.55 + 0.45 * Math.sin(frame * 0.08);
  ctx.globalAlpha = p; ctx.font = `800 15px ${FONT}`; ctx.fillStyle = '#ffe08a';
  ctx.fillText(matchMedia('(pointer: coarse)').matches ? 'TAP TO START' : 'PRESS ANY KEY', W / 2, 232);
  ctx.globalAlpha = 1;
  ctx.font = `500 9px ${FONT}`; ctx.fillStyle = 'rgba(200,210,240,.75)';
  ctx.fillText('Higher lance wins the clash  •  Collect cocoons before they hatch  •  Avoid the water', W / 2, 254);
  if (best) { ctx.font = `700 10px ${FONT}`; ctx.fillStyle = '#bfe8ff'; ctx.fillText('BEST  ' + fmt(best), W / 2, 274); }
  if (!matchMedia('(pointer: coarse)').matches) { ctx.font = `500 8px ${FONT}`; ctx.fillStyle = 'rgba(200,210,240,.55)'; ctx.fillText('← → / A D to steer   •   SPACE / ↑ to flap   •   P pause   •   M mute', W / 2, 292); }
}
function drawOver() {
  ctx.fillStyle = `rgba(5,5,20,${Math.min(game.overT / 60, 0.55)})`; ctx.fillRect(0, 0, W, H);
  bigText('GAME OVER', 140, 44, '#ffd6e0', '#ff5a7a');
  ctx.font = `700 14px ${FONT}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.fillText('Score ' + fmt(score) + '   •   Wave ' + wave, W / 2, 168);
  if (score >= best && score > 0) { ctx.fillStyle = '#ffe08a'; ctx.fillText('NEW BEST!', W / 2, 188); }
  if (game.overT > 80) { ctx.globalAlpha = 0.55 + 0.45 * Math.sin(frame * 0.08); ctx.font = `700 11px ${FONT}`; ctx.fillStyle = '#cfe6ff'; ctx.fillText('Tap to continue', W / 2, 220); ctx.globalAlpha = 1; }
}
function drawPause() {
  ctx.fillStyle = 'rgba(5,5,20,.55)'; ctx.fillRect(0, 0, W, H);
  bigText('PAUSED', 160, 40, '#ffffff', '#9fc8ff');
  ctx.font = `600 11px ${FONT}`; ctx.fillStyle = '#dde'; ctx.textAlign = 'center'; ctx.fillText('Tap to resume', W / 2, 185);
}

function render() {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  if (shake > 0.3) ctx.translate(rnd(-shake, shake) * 0.5, rnd(-shake, shake) * 0.5);
  drawBackground();
  drawSea(false);
  drawPlatforms();
  drawFlies();
  if (game.state !== 'title') {
    for (const c of cocoons) drawCocoon(c);
    for (const f of fleers) drawFleer(f);
    for (const e of enemies) drawRider(e);
    if (P) drawRider(P);
    drawOrb();
    drawSerpent();
  }
  drawParts();
  drawSea(true);
  if (serp.ph === 1 && game.state === 'play') {
    ctx.strokeStyle = `rgba(200,240,255,${0.4 + 0.3 * Math.sin(frame * 0.5)})`; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(serp.x, SEA + 2, 6 + i * 6 + (frame % 12), 1.6 + i, 0, 0, TAU); ctx.stroke(); }
  }
  drawTexts();
  ctx.setTransform(K, 0, 0, K, 0, 0);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.04})`; ctx.fillRect(0, 0, W, H); }
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,10,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (game.state === 'title') drawTitle();
  else {
    drawHUD(); drawBanner();
    if (game.state === 'over') drawOver();
    else if (paused) drawPause();
  }
}

// ---------- main loop ----------
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(t) {
  acc += Math.min(t - last, 100); last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);
window.__sky = { get game() { return game; }, get P() { return P; }, get enemies() { return enemies; }, get score() { return score; }, input, newGame };
</script>
</body>
</html>

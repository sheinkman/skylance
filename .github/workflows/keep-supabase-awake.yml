# Free Supabase projects pause after 7 days without activity.
# Every 3 days this makes one read-only API call so the backend stays awake.
# The key below is the publishable (public) key that already ships inside the game.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call a read-only database function
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -m 30 -X POST \
              "https://znipfvuysadwnucczjtm.supabase.co/rest/v1/rpc/collect_referral_rewards" \
              -H "apikey: sb_publishable_FgPeCWE27DDUt52Aeqj9Mg_LW8nlXZS" \
              -H "Content-Type: application/json" \
              -d '{"p_code":"keepal","p_secret":"00000000-0000-0000-0000-000000000000"}')
            echo "HTTP $code: $(cat /tmp/out)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Supabase did not answer. If the project is paused, restore it in the Supabase dashboard."
          exit 1
